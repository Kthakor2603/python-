<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c10;
    --card: #16161e;
    --surface: #1e1e28;
    --accent: #7c6af7;
    --accent2: #f76a8a;
    --green: #4ade80;
    --text: #f0f0f5;
    --muted: #606070;
    --border: #2a2a38;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 40px 20px;
  }
  body::before {
    content: '';
    position: fixed;
    top: -100px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 400px;
    background: radial-gradient(ellipse, rgba(124,106,247,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .container { max-width: 600px; margin: 0 auto; }

  /* Header */
  .header { margin-bottom: 36px; }
  .header .label { font-size: 11px; letter-spacing: 4px; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; }
  .header h1 { font-family: 'Syne', sans-serif; font-size: 42px; font-weight: 800; line-height: 1; margin-bottom: 8px; }
  .header p { color: var(--muted); font-size: 13px; }

  /* Stats */
  .stats { display: flex; gap: 12px; margin-bottom: 28px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 20px; flex: 1; text-align: center; }
  .stat .num { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 700; }
  .stat .lbl { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  .stat.total .num { color: var(--text); }
  .stat.done .num { color: var(--green); }
  .stat.pending .num { color: var(--accent2); }

  /* Add Task */
  .add-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 24px; display: flex; gap: 12px; }
  .add-box input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .add-box input:focus { border-color: var(--accent); }
  .add-box input::placeholder { color: var(--muted); }
  .add-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px 22px;
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .add-btn:hover { background: #6a59e0; transform: translateY(-1px); }
  .add-btn:active { transform: translateY(0); }

  /* Error */
  .error-msg { background: rgba(247,106,138,0.1); border: 1px solid rgba(247,106,138,0.3); color: var(--accent2); border-radius: 10px; padding: 12px 18px; font-size: 13px; margin-bottom: 16px; display: none; }
  .error-msg.show { display: block; }

  /* Filter Tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 18px; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); cursor: pointer; transition: all 0.2s; letter-spacing: 1px; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

  /* Task List */
  .task-list { display: flex; flex-direction: column; gap: 10px; }

  .task-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    animation: slideIn 0.3s ease;
    transition: border-color 0.2s;
  }
  .task-item:hover { border-color: var(--accent); }
  .task-item.done-item { opacity: 0.6; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Checkbox */
  .check-btn {
    width: 26px; height: 26px;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    font-size: 14px;
  }
  .check-btn:hover { border-color: var(--green); }
  .check-btn.checked { background: var(--green); border-color: var(--green); }

  /* Task text */
  .task-text { flex: 1; font-size: 15px; color: var(--text); line-height: 1.4; }
  .task-text.striked { text-decoration: line-through; color: var(--muted); }

  /* Delete btn */
  .del-btn {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 6px 10px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .del-btn:hover { border-color: var(--accent2); color: var(--accent2); background: rgba(247,106,138,0.1); }

  /* Empty state */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .icon { font-size: 48px; margin-bottom: 16px; }
  .empty p { font-size: 14px; letter-spacing: 1px; }

  /* Footer */
  .footer { text-align: center; margin-top: 40px; font-size: 11px; color: var(--muted); letter-spacing: 2px; }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="label">// python + flask</div>
    <h1>To-Do List</h1>
    <p>Manage your daily tasks easily</p>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat total"><div class="num" id="totalCount">0</div><div class="lbl">Total</div></div>
    <div class="stat done"><div class="num" id="doneCount">0</div><div class="lbl">Done</div></div>
    <div class="stat pending"><div class="num" id="pendingCount">0</div><div class="lbl">Pending</div></div>
  </div>

  <!-- Add Task -->
  <div class="add-box">
    <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="100" />
    <button class="add-btn" onclick="addTask()">+</button>
  </div>
  <div class="error-msg" id="errorMsg">⚠ Task cannot be empty!</div>

  <!-- Filter Tabs -->
  <div class="tabs">
    <div class="tab active" onclick="filterTasks('all', this)">All</div>
    <div class="tab" onclick="filterTasks('pending', this)">Pending</div>
    <div class="tab" onclick="filterTasks('done', this)">Done</div>
  </div>

  <!-- Task List -->
  <div class="task-list" id="taskList"></div>

  <div class="footer">built with python 🐍 · parul university</div>
</div>

<script>
let allTasks = [];
let currentFilter = 'all';

// Load tasks on page load
window.onload = function() {
  loadTasks();
};

async function loadTasks() {
  const res = await fetch('/tasks');
  allTasks = await res.json();
  renderTasks();
  updateStats();
}

async function addTask() {
  const input = document.getElementById('taskInput');
  const taskText = input.value.trim();
  const errorMsg = document.getElementById('errorMsg');

  if (!taskText) {
    errorMsg.classList.add('show');
    setTimeout(() => errorMsg.classList.remove('show'), 2000);
    return;
  }

  errorMsg.classList.remove('show');

  const res = await fetch('/tasks', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ task: taskText })
  });

  const data = await res.json();
  if (!data.error) {
    allTasks.push(data);
    input.value = '';
    renderTasks();
    updateStats();
  }
}

async function markDone(id) {
  const res = await fetch(`/tasks/${id}/done`, { method: 'PUT' });
  const updated = await res.json();
  allTasks = allTasks.map(t => t.id === id ? updated : t);
  renderTasks();
  updateStats();
}

async function deleteTask(id) {
  await fetch(`/tasks/${id}`, { method: 'DELETE' });
  allTasks = allTasks.filter(t => t.id !== id);
  renderTasks();
  updateStats();
}

function filterTasks(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

function renderTasks() {
  const list = document.getElementById('taskList');
  let filtered = allTasks;

  if (currentFilter === 'pending') filtered = allTasks.filter(t => !t.done);
  if (currentFilter === 'done')    filtered = allTasks.filter(t => t.done);

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <div class="icon">📋</div>
        <p>No tasks here yet!</p>
      </div>`;
    return;
  }

  list.innerHTML = filtered.map(task => `
    <div class="task-item ${task.done ? 'done-item' : ''}">
      <button class="check-btn ${task.done ? 'checked' : ''}" onclick="markDone(${task.id})">
        ${task.done ? '✓' : ''}
      </button>
      <span class="task-text ${task.done ? 'striked' : ''}">${task.task}</span>
      <button class="del-btn" onclick="deleteTask(${task.id})">🗑</button>
    </div>
  `).join('');
}

function updateStats() {
  const total = allTasks.length;
  const done  = allTasks.filter(t => t.done).length;
  document.getElementById('totalCount').textContent   = total;
  document.getElementById('doneCount').textContent    = done;
  document.getElementById('pendingCount').textContent = total - done;
}

// Press Enter to add task
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('taskInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask();
  });
});
</script>
</body>
</html>
